[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Fast unit tests, no external dependencies
    e2e: Full pipeline tests, all external deps mocked (no Bitwig required)
    integration: Requires running vLLM backend
    bridge: Requires running BitwigAgentBridge (Bitwig + Extension aktiv)
    neo4j: Requires Neo4j to be running
    slow: Takes more than 5 seconds
addopts =
    -v
    --tb=short
    -m "not integration and not neo4j and not bridge"
