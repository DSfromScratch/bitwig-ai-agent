[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Fast unit tests, no external dependencies
    integration: Requires Bitwig + OSC bridge (Port 8001)
    neo4j: Requires Neo4j to be running
    slow: Takes more than 5 seconds
addopts =
    -v
    --tb=short
    -m "not integration and not neo4j"
